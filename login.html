<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Login | American Federation</title>

  <style>
    :root {
      --bg: #090b0f;
      --panel: #11151c;
      --gold: #d4af37;
      --text: #f5f5f5;
      --muted: #a9adb5;
      --border: #2b313b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      background: #0d1016;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    main {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 55px 22px 70px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(2rem, 8vw, 3rem);
    }

    .intro {
      margin: 0 auto 32px;
      max-width: 430px;
      color: var(--muted);
      text-align: center;
    }

    .login-card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #0b0e13;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: var(--gold);
      color: #090b0f;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    #message {
      min-height: 24px;
      margin: 18px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: .92rem;
    }

    .back {
      display: block;
      margin-top: 28px;
      color: var(--gold);
      text-align: center;
      text-decoration: none;
      font-weight: 700;
    }

    footer {
      padding: 24px 22px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: .85rem;
    }
  </style>
</head>

<body>

<header>
  <a class="brand" href="index.html">
    <img src="american-federation-logo.png" alt="American Federation">
    <span>AMERICAN FEDERATION</span>
  </a>
</header>

<main>
  <p class="eyebrow">AMERICAN FEDERATION</p>

  <h1>Member Login</h1>

  <p class="intro">
    Sign in to access the American Federation Members Area.
  </p>

  <div class="login-card">
    <form id="loginForm">

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        SIGN IN
      </button>

      <p id="message" role="status" aria-live="polite"></p>

    </form>
  </div>

  <a class="back" href="index.html">
    ← Return to American Federation
  </a>
</main>

<footer>
  American Federation
</footer>

<script type="module">

  import { createClient }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL =
    "https://iauyrxtpbjriyeicnjpg.supabase.co";

  /*
    PASTE YOUR SUPABASE PUBLISHABLE KEY
    BETWEEN THE QUOTATION MARKS BELOW.

    DO NOT use a service_role or secret key.
  */

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_GyKSN6klqCjQQOB4g3Un9g_URqbXc8g";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    button.disabled = true;
    message.textContent = "Signing in...";

    const { error } =
      await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message.textContent = error.message;
      button.disabled = false;
      return;
    }

    /*
      Successful authentication currently sends
      the member to the Members Area.

      We will add the Federation membership-status
      check before making this production-ready.
    */

    window.location.href = "members.html";

  });

</script>

</body>
</html>
